name: Apply DB migrations

# Manual only — never runs on a push, so schema changes are always deliberate.
# Applies any pending files in supabase/migrations/ to the hosted Supabase
# project via the Management API. Requires the repo secret SUPABASE_ACCESS_TOKEN.
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Supabase project ref"
        required: true
        default: "tlapegutuiaikhbjhhkg"

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ github.event.inputs.project_ref }}
        run: node scripts/apply-migrations.mjs
